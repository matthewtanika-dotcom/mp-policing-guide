name: Build Play Store bundle (AAB)

# Run this by hand: Actions tab -> "Build Play Store bundle (AAB)" -> Run workflow.

on:
  workflow_dispatch:

env:
  TARGET_SDK: "35"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Copy web app into Capacitor project
        run: |
          mkdir -p capacitor-project/www
          cp index.html manifest.json service-worker.js capacitor-project/www/
          cp logo.png capacitor-project/www/

      - name: Install Capacitor dependencies
        working-directory: capacitor-project
        run: npm install

      - name: Add Android platform
        working-directory: capacitor-project
        run: npx cap add android

      - name: Set version from package.json
        working-directory: capacitor-project
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          echo "versionCode=${{ github.run_number }} versionName=$VERSION_NAME"

      - name: Set target SDK for Play
        working-directory: capacitor-project
        run: |
          sed -i "s/targetSdkVersion = [0-9]*/targetSdkVersion = $TARGET_SDK/; s/compileSdkVersion = [0-9]*/compileSdkVersion = $TARGET_SDK/" android/variables.gradle
          echo "android.suppressUnsupportedCompileSdk=$TARGET_SDK" >> android/gradle.properties
          cat android/variables.gradle

      - name: Build MP icon + splash
        working-directory: capacitor-project
        run: |
          pip install pillow
          cat > make_assets.py <<'PYEOF'
          """Builds every Android launcher icon + splash from the ONE file ../logo.png."""
          import os, shutil, glob
          from PIL import Image, ImageDraw, ImageFont
          HERE=os.getcwd()
          RES=os.path.join(HERE,'android/app/src/main/res')
          src=[p for p in (os.path.join(HERE,'..','logo.png'),os.path.join(HERE,'..','icon-512.png')) if os.path.exists(p)][0]
          logo=Image.open(src).convert('RGBA').resize((512,512),Image.LANCZOS)
          BG=(10,10,10,255)
          # remove stock Capacitor icons so nothing overrides ours
          for d in glob.glob(RES+'/mipmap-*')+glob.glob(RES+'/drawable-v24'):
              shutil.rmtree(d,ignore_errors=True)
          for f in ('drawable/ic_launcher_background.xml',):
              try: os.remove(os.path.join(RES,f))
              except OSError: pass
          def sq(px,bg=True):
              return logo.resize((px,px),Image.LANCZOS)
          sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for d,px in sizes.items():
              o=os.path.join(RES,'mipmap-'+d); os.makedirs(o,exist_ok=True)
              sq(px).convert('RGB').save(o+'/ic_launcher.png')
              r=sq(px); m=Image.new('L',(px*4,px*4),0); ImageDraw.Draw(m).ellipse([0,0,px*4-1,px*4-1],fill=255)
              r.putalpha(m.resize((px,px),Image.LANCZOS)); r.save(o+'/ic_launcher_round.png')
              fg=int(px*108/48); c=Image.new('RGBA',(fg,fg),(0,0,0,0)); k=int(fg*0.72)
              c.alpha_composite(logo.resize((k,k),Image.LANCZOS),((fg-k)//2,(fg-k)//2)); c.save(o+'/ic_launcher_foreground.png')
          ad=os.path.join(RES,'mipmap-anydpi-v26'); os.makedirs(ad,exist_ok=True)
          xml='<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n<background android:drawable="@color/ic_launcher_background"/>\n<foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n'
          for n in ('ic_launcher.xml','ic_launcher_round.xml'): open(os.path.join(ad,n),'w').write(xml)
          open(os.path.join(RES,'values/ic_launcher_background.xml'),'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n<color name="ic_launcher_background">#0A0A0A</color>\n</resources>\n')
          # splash
          FB='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          def font(sz):
              try: return ImageFont.truetype(FB,sz)
              except Exception: return ImageFont.load_default()
          def splash(w,h):
              im=Image.new('RGBA',(w,h),BG); u=min(w,h); s=int(u*0.5)
              cy=int(h*0.42); im.alpha_composite(logo.resize((s,s),Image.LANCZOS),((w-s)//2,cy-s//2))
              d=ImageDraw.Draw(im)
              for t,sz,col,dy in (('MP POLICING GUIDE',int(u*0.06),(240,240,242),0.05),('INFORM | REFER | PROTECT',int(u*0.03),(170,172,178),0.14)):
                  f=font(sz); b=d.textbbox((0,0),t,font=f); d.text(((w-(b[2]-b[0]))/2,cy+s/2+u*dy),t,font=f,fill=col)
              return im.convert('RGB')
          vari={'mdpi':(320,480),'hdpi':(480,800),'xhdpi':(720,1280),'xxhdpi':(960,1600),'xxxhdpi':(1280,1920)}
          for d,(w,h) in vari.items():
              for o,(ww,hh) in (('port',(w,h)),('land',(h,w))):
                  p=os.path.join(RES,f'drawable-{o}-{d}'); os.makedirs(p,exist_ok=True); splash(ww,hh).save(p+'/splash.png')
          os.makedirs(RES+'/drawable',exist_ok=True); splash(480,320).save(RES+'/drawable/splash.png')
          print('Android icons + splash built from logo.png')
          PYEOF
          python3 make_assets.py
          test ! -e android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_background.png

      - name: Add signing key
        working-directory: capacitor-project
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload.keystore
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file("upload.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "mpguide"
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE

      - name: Sync Capacitor
        working-directory: capacitor-project
        run: npx cap sync android

      - name: Build signed AAB
        working-directory: capacitor-project/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: mp-policing-guide-play-bundle
          path: capacitor-project/android/app/build/outputs/bundle/release/app-release.aab
