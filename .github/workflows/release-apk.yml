name: Build and release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    # Pinned: GitHub is moving ubuntu-latest to Ubuntu 26 from 19 Oct 2026.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # The old "Set up Android SDK" step (android-actions/setup-android@v3,
      # a Node 20 action) is removed. The runner already ships the Android SDK
      # (ANDROID_HOME is set). This just lets Gradle auto-download any
      # missing SDK piece.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Copy web app into Capacitor project
        run: |
          rm -rf capacitor-project/www
          mkdir -p capacitor-project/www
          # Bundle every web file (not a fixed list) so new JS/CSS/data/image
          # files always end up inside the APK.
          tar -cf - \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='capacitor-project' \
            --exclude='node_modules' \
            --exclude='download.html' \
            --exclude='generate-icons.js' \
            --exclude='README.md' \
            --exclude='BUILD_APK.txt' \
            --exclude='UPDATE_NOTES.txt' \
            --exclude='.gitignore' \
            --exclude='*.zip' \
            --exclude='*.apk' \
            . | tar -xf - -C capacitor-project/www
          test -f capacitor-project/www/index.html || { echo "index.html missing from www"; exit 1; }
          # Stamp the service worker so every build gets a fresh cache.
          if [ -f capacitor-project/www/service-worker.js ]; then
            sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" capacitor-project/www/service-worker.js
          fi
          echo "Files bundled into the app:"
          ls -la capacitor-project/www

      - name: Install Capacitor dependencies
        working-directory: capacitor-project
        run: npm install --no-audit --no-fund

      - name: Add Android platform (fresh)
        working-directory: capacitor-project
        run: |
          rm -rf android
          npx cap add android

      - name: Apply custom Android app icons
        run: |
          if [ -d capacitor-project/android-icons ]; then
            cp -r capacitor-project/android-icons/. capacitor-project/android/app/src/main/res/
            echo "Copied custom Android icons"
          else
            echo "No capacitor-project/android-icons folder - using default icon"
          fi

      - name: Set app version from git tag
        run: |
          # v4.1.3 (or v.4.1.3) -> versionName 4.1.3, versionCode 40103
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG#.}"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IFS=. read -r MA MI PA <<< "$TAG"
            CODE=$((MA * 10000 + MI * 100 + PA))
            sed -i "s/versionCode [0-9]*/versionCode $CODE/; s/versionName \".*\"/versionName \"$TAG\"/" capacitor-project/android/app/build.gradle
          else
            echo "Not a x.y.z tag - leaving default version"
          fi
          grep -nE "versionCode|versionName" capacitor-project/android/app/build.gradle

      - name: Sync Capacitor
        working-directory: capacitor-project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: capacitor-project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK for release
        run: |
          test -f capacitor-project/android/app/build/outputs/apk/debug/app-debug.apk || { echo "APK not found"; exit 1; }
          cp capacitor-project/android/app/build/outputs/apk/debug/app-debug.apk mp-policing-guide.apk

      - name: Create GitHub Release with APK attached
        uses: softprops/action-gh-release@v3
        with:
          files: mp-policing-guide.apk
          generate_release_notes: true
