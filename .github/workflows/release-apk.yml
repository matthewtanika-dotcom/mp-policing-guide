name: Build and release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # NOTE: "Set up Android SDK" step removed. ubuntu-latest already ships
      # with the Android SDK (ANDROID_HOME is set), and that step was the one
      # failing. Gradle uses the preinstalled SDK.

      - name: Copy web app into Capacitor project
        run: |
          rm -rf capacitor-project/www
          mkdir -p capacitor-project/www
          # Copy everything the web app needs (not just a fixed file list),
          # so any new JS/CSS/data/image files end up inside the APK too.
          tar -cf - \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='capacitor-project' \
            --exclude='node_modules' \
            --exclude='download.html' \
            --exclude='README.md' \
            --exclude='BUILD_APK.txt' \
            --exclude='.gitignore' \
            --exclude='*.zip' \
            --exclude='*.apk' \
            . | tar -xf - -C capacitor-project/www
          test -f capacitor-project/www/index.html || { echo "index.html missing from www"; exit 1; }
          echo "Files bundled into the app:"
          ls -la capacitor-project/www

      - name: Install Capacitor dependencies
        working-directory: capacitor-project
        run: npm install

      - name: Add Android platform
        working-directory: capacitor-project
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: capacitor-project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: capacitor-project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK for release
        run: |
          test -f capacitor-project/android/app/build/outputs/apk/debug/app-debug.apk || { echo "APK not found"; exit 1; }
          cp capacitor-project/android/app/build/outputs/apk/debug/app-debug.apk mp-policing-guide.apk

      - name: Create GitHub Release with APK attached
        uses: softprops/action-gh-release@v2
        with:
          files: mp-policing-guide.apk
          generate_release_notes: tru
