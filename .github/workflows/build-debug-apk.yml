name: Build debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy web app
        run: |
          mkdir -p capacitor-project/www
          cp index.html capacitor-project/www/
          cp manifest.json capacitor-project/www/
          cp service-worker.js capacitor-project/www/
          cp icon-192.png capacitor-project/www/
          cp icon-512.png capacitor-project/www/

      - name: Install Capacitor
        working-directory: capacitor-project
        run: npm install

      - name: Add Android platform
        working-directory: capacitor-project
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: capacitor-project
        run: npx cap sync android

      - name: Build APK
        working-directory: capacitor-project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mp-policing-guide-debug-apk
          path: capacitor-project/android/app/build/outputs/apk/debug/app-debug.apk
