name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./capacitor-project
        run: npm install

      - name: Build web app
        run: echo "No separate web build required - index.html is already in repository root"

      - name: Sync Capacitor Android
        working-directory: ./capacitor-project
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make Gradle executable
        working-directory: ./capacitor-project/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./capacitor-project/android
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mp-policing-guide-debug-apk
          path: capacitor-project/android/app/build/outputs/apk/debug/app-debug.apk
