name: Create Android Signing Key

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Create signing keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore mp-policing-guide.keystore \
            -alias mp-policing-guide \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass tempPassword123 \
            -keypass tempPassword123 \
            -dname "CN=MP Policing Guide, OU=MP, O=MP Policing Guide, L=Unknown, ST=Unknown, C=GB"

      - name: Encode keystore
        run: |
          base64 -w 0 mp-policing-guide.keystore > keystore.base64

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: mp-policing-guide-keystore
          path: keystore.base64
